name: proviantplaner
description: "Proviant- und Bordkassenplanung auf Segeltörns – powered by HullQ"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management (Leitplanken)
  flutter_riverpod: ^2.5.1

  # Navigation (Leitplanken)
  go_router: ^14.2.0

  # Übersetzung & Lokalisierung (Leitplanken)
  intl: ^0.19.0

  # Sichere Token-Ablage (Leitplanken)
  flutter_secure_storage: ^9.2.2

  # Lokale Datenbank (Leitplanken)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - data/catalog_v0.7.json
    - data/quantities_v0.4.json
