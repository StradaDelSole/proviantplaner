name: proviantplaner
description: "Proviant- und Bordkassenplanung auf Segeltörns – powered by HullQ"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management (Leitplanken)
  flutter_riverpod: ^2.5.1

  # Navigation (Leitplanken)
  go_router: ^14.2.0

  # Übersetzung & Lokalisierung (Leitplanken)
  intl: ^0.19.0

  # Sichere Token-Ablage (Leitplanken)
  flutter_secure_storage: ^9.2.2

  # Lokale Datenbank (Leitplanken)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Standards & Export (freigegeben ab v0.13 / GEMINI.md Regel 8)
  qr_flutter: ^4.1.0
  qr: ^3.0.2
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  zxing2: ^0.2.3
  image: ^4.2.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - data/catalog_v0.10.json
    - data/catalog_v0.9.json
    - data/catalog_v0.8.json
    - data/catalog_v0.7.json
    - data/quantities_v0.6.json
    - data/quantities_v0.5.json
    - data/quantities_v0.4.json
    - data/i18n/

  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
